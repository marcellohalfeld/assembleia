[project]
name = "blatt-plataforma"
version = "0.2.0"
description = "Código comum da plataforma Blatt, sem regra de negócio: blatt.comum, blatt.infra (configuração, arquivo imutável, migrações, fatos) e blatt.web (PLAT-0016)"
readme = "src/blatt/README.md"
requires-python = ">=3.12"
authors = [{ name = "Marcello Halfeld" }]
# Licença do próprio código: pendente, como na plataforma (docs/PLATAFORMA.md, PLAT-0001)
dependencies = [
    # blatt.infra.postgres.migracoes importa o psycopg; LGPL com exceção nominal (PLAT-0008).
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
# Base da interface web (blatt.web, PLAT-0021). Licenças conferidas no PyPI em 13/11/2026:
# FastAPI 0.162.5 MIT; Starlette 1.10.0 BSD-3-Clause; Jinja2 3.1.6 BSD; Uvicorn 0.54.0
# BSD-3-Clause; python-multipart 0.0.33 Apache-2.0. Só quem tem adaptador web instala:
# "blatt-plataforma[web]".
web = [
    "fastapi>=0.162.5",
    "jinja2>=3.1.6",
    "uvicorn>=0.54.0",
    "python-multipart>=0.0.33",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
    "pip-licenses>=5",
    # Cliente de teste do Starlette (TestClient); BSD-3-Clause, conferido no PyPI (0.28.1).
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# `blatt` é namespace package (PEP 420, PLAT-0016, item 4.3): não há src/blatt/__init__.py;
# o wheel leva só blatt/comum, blatt/infra e blatt/web (com os modelos e os estáticos).
[tool.hatch.build.targets.wheel]
only-include = ["src/blatt/comum", "src/blatt/infra", "src/blatt/web"]
exclude = ["__pycache__", "*.pyc"]
sources = ["src"]

[tool.hatch.build.targets.sdist]
include = ["src/blatt", "tests", "pyproject.toml", "uv.lock"]

# --- Qualidade (igual à dos módulos, docs/PLATAFORMA.md seção 6) ----------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
# Sem src/blatt/__init__.py, o mypy precisa tratar `src` como raiz dos pacotes.
explicit_package_bases = true
namespace_packages = true
packages = ["blatt.comum", "blatt.infra", "blatt.web"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

# --- Fronteiras do pacote (PLAT-0016, item 4.1) ---------------------------------
#
# `blatt` é namespace package e é a raiz do grafo. Neste ambiente só existem blatt.comum,
# blatt.infra e blatt.web; um import de qualquer outro `blatt.<x>` (folha, cadastro, fiscal,
# contabil...) não acha o módulo e o grimp o registra como import do próprio `blatt`. Por isso o
# primeiro contrato proíbe importar `blatt` sem tratar como pacote (as_packages = false): pega
# qualquer módulo de negócio sem proibir os subpacotes deste. Não dá para listar `blatt.folha`
# como módulo externo: o import-linter 2.16 recusa subpacote de pacote externo. O teste
# tests/test_fronteiras.py confere as mesmas regras lendo os imports do código.

[tool.importlinter]
root_package = "blatt"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "blatt.comum, blatt.infra e blatt.web não importam módulo de negócio"
type = "forbidden"
source_modules = [
    "blatt.comum", "blatt.comum.**", "blatt.infra", "blatt.infra.**", "blatt.web", "blatt.web.**",
]
forbidden_modules = ["blatt"]
as_packages = false

[[tool.importlinter.contracts]]
name = "blatt.comum não importa blatt.infra nem blatt.web"
type = "forbidden"
source_modules = ["blatt.comum"]
forbidden_modules = ["blatt.infra", "blatt.web"]

[[tool.importlinter.contracts]]
name = "blatt.infra não importa blatt.web nem a pilha web"
type = "forbidden"
source_modules = ["blatt.infra"]
forbidden_modules = ["blatt.web", "fastapi", "starlette", "jinja2", "uvicorn", "python_multipart"]

[[tool.importlinter.contracts]]
name = "blatt.web.apresentacao funciona sem o extra web"
type = "forbidden"
source_modules = ["blatt.web.apresentacao"]
forbidden_modules = ["fastapi", "starlette", "jinja2", "markupsafe", "uvicorn", "python_multipart"]
